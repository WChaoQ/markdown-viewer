name: Android Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the signed APK as a public GitHub Release v1.0.0
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and build signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          KEYSTORE_PATH="$RUNNER_TEMP/markdown-viewer-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests and build APKs
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug assembleRelease

      - name: Verify Release APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: markdown-viewer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: markdown-viewer-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish public v1.0.0 GitHub Release
    needs: release
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed Release APK
        uses: actions/download-artifact@v4
        with:
          name: markdown-viewer-release-signed
          path: release-apk

      - name: Create public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Markdown Viewer 1.0.0
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Markdown Viewer 1.0.0

            First public release of the Android Markdown Viewer.

            ### Features
            - Read-only Markdown and GFM rendering
            - LaTeX math formulas powered by KaTeX
            - Mermaid diagrams
            - Code syntax highlighting and copy buttons
            - In-document search
            - Light and dark theme support
            - Offline rendering with bundled assets

            ### Download
            Download **markdown-viewer-v1.0.0.apk** below and install it on your Android device. You may need to allow installation from your browser or file manager.

            ### Requirements
            - Android 6.0 (API 23) or later

            ### Build and attribution
            Created and built with ChatGPT (OpenAI) under the project owner's direction. The signed APK is built and signature-verified by GitHub Actions.
          files: release-apk/app-release.apk
          fail_on_unmatched_files: true
